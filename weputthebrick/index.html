<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>We put the ___ on the ___</title>
  <script type="module" src="/weputthebrick/main.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 1rem;
      font-family: "Chalkboard SE", "Comic Sans MS", "Marker Felt", cursive;
      color: #fff7d6;
      background: radial-gradient(circle at 20% 10%, #1f7a4d 0, #0f4a2e 45%, #08301d 100%);
    }
    main { width: min(640px, 100%); text-align: center; }
    h1 {
      margin: 0 0 .25rem; font-size: clamp(1.6rem, 6vw, 2.6rem); letter-spacing: .02em;
      text-shadow: 3px 3px 0 #08301d; transform: rotate(-1.5deg);
    }
    h1 span { color: #ffd23f; }
    p { margin: 0 0 1rem; opacity: .85; }
    canvas {
      width: 100%; height: auto; display: block; border: 10px solid #f4e3b5; border-radius: 6px;
      box-shadow: 0 10px 0 #5a3a1a, 0 18px 30px rgba(0, 0, 0, .5); background: #222;
      transform: rotate(.6deg);
    }
    canvas.pop { animation: pop .45s ease-out; }
    @keyframes pop { 0% { transform: scale(.94) rotate(-2deg); } 60% { transform: scale(1.03) rotate(1deg); } 100% { transform: scale(1) rotate(.6deg); } }
    form { display: flex; gap: .6rem; margin-top: 2rem; flex-wrap: wrap; }
    input {
      flex: 1 1 240px; font: inherit; font-size: 1.1rem; padding: .7rem 1rem; color: #222;
      background: #fffbea; border: 3px solid #ffd23f; border-radius: 12px; outline: none;
    }
    input:focus { box-shadow: 0 0 0 4px rgba(255, 210, 63, .5); }
    button, a.btn {
      font: inherit; font-size: 1.1rem; font-weight: bold; padding: .7rem 1.4rem; cursor: pointer;
      color: #3b2200; background: #ffd23f; border: 3px solid #3b2200; border-radius: 12px;
      box-shadow: 0 5px 0 #3b2200; text-decoration: none; transition: transform .08s, box-shadow .08s;
    }
    button:hover:not(:disabled), a.btn:hover { transform: translateY(-2px) rotate(-1deg); }
    button:active:not(:disabled), a.btn:active { transform: translateY(4px); box-shadow: 0 1px 0 #3b2200; }
    button:disabled { opacity: .5; cursor: wait; }
    #save { display: inline-block; margin-top: .6rem; background: #fffbea; }
    #save[hidden] { display: none; }
  </style>
</head>
<body>
  <main>
    <h1>We put the <span>brick</span> on the <span>accelerator</span></h1>
    <p>Write your own message on Father Ted's chalkboard.</p>
    <canvas id="board" width="500" height="382"></canvas>
    <form onsubmit="return false">
      <input id="text" type="text" placeholder="your text here" maxlength="120" autocomplete="off" aria-label="Chalkboard text" />
      <button id="go" disabled>Generate!</button>
    </form>
    <a id="save" class="btn" href="#" download="meme.png" hidden>Download PNG</a>
  </main>
</body>
</html>
